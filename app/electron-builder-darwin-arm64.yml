extends: "./electron-builder-common.yml"
productName: "Kora Note"
appId: "org.b3log.siyuan"
afterPack: "./scripts/after-pack-mac-helpers.js"
publish: null
asar: false
compression: "normal"
artifactName: "koranote-${version}-${os}-arm64.${ext}"
extraMetadata:
  main: "electron-dist/main.js"
directories:
  output: "build"
files:
  - "electron-dist"
extraFiles:
  - from: "../LICENSE"
    to: "Resources/LICENSE"
  - from: "../THIRD_PARTY_NOTICES.md"
    to: "Resources/THIRD_PARTY_NOTICES.md"

mac:
  icon: "src/assets/icon.icns"
  gatekeeperAssess: false
  hardenedRuntime: true
  extendInfo:
    NSMicrophoneUsageDescription: "This app requires microphone access to record audio."
    CFBundleName: "Kora"
    CFBundleDisplayName: "Kora Note"
  minimumSystemVersion: "12.0.0"
  protocols:
    - name: "Kora Note"
      schemes:
        - "siyuan"
  extraResources:
    - from: "kernel-darwin-arm64"
      to: "kernel"
  target:
    - target: "dmg"
      arch: "arm64"

extraResources:
  - from: "changelogs"
    to: "changelogs"
    filter: ["v${version}/**"]
  - from: "stage"
    to: "stage"
    filter: ["**/*"]
  - from: "guide"
    to: "guide"
    filter: "!**/{.DS_Store,.git,.gitignore,.idea}"
  - from: "appearance/boot"
    to: "appearance/boot"
    filter: "!**/{.DS_Store}"
  - from: "appearance/covers"
    to: "appearance/covers"
    filter: "!**/{.DS_Store}"
  - from: "appearance/icons"
    to: "appearance/icons"
    filter:
      - "index.html"
      - "litheness/**/*"
  - from: "appearance/langs"
    to: "appearance/langs"
    filter: "!**/{.DS_Store}"
  - from: "appearance/emojis"
    to: "appearance/emojis"
    filter: "!**/{.DS_Store}"
  - from: "appearance/themes/midnight"
    to: "appearance/themes/midnight"
    filter: "!**/{.DS_Store,custom.css}"
  - from: "appearance/themes/daylight"
    to: "appearance/themes/daylight"
    filter: "!**/{.DS_Store,custom.css}"
  - from: "appearance/fonts"
    to: "appearance/fonts"
    filter: "!**/{.DS_Store}"
