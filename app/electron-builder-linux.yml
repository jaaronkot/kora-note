extends: "./electron-builder-common.yml"
productName: "Kora Note"
appId: "org.b3log.siyuan"
publish: null
asar: false
compression: "normal"
toolsets:
  # 静态运行时无需目标系统安装 libfuse2。
  appimage: "1.0.3"
artifactName: "koranote-${version}-${os}.${ext}"
extraMetadata:
  main: "electron-dist/main.js"
directories:
  output: "build"
files:
  - "electron-dist"
extraFiles:
  - from: "../LICENSE"
    to: "LICENSE"
  - from: "../THIRD_PARTY_NOTICES.md"
    to: "THIRD_PARTY_NOTICES.md"

linux:
  icon: "src/assets/icon/"
  category: "Utility"
  syncDesktopName: true
  executableName: "siyuan"
  desktop: {
    entry: {
      Name: "Kora Note",
      Comment: "From thought to insight, with agents",
      Type: "Application",
      Categories: "Utility;"
    }
  }
  extraResources:
    - from: "kernel-linux"
      to: "kernel"
  target:
    - target: "tar.gz"
    - target: "AppImage"
    - target: "deb"
    - target: "rpm"

appImage:
  # 保留现有压缩格式，兼容安装包检查工具。
  compression: "gzip"
  # 保留桌面入口的既有启动参数。
  executableArgs: ["--no-sandbox"]

rpm:
  # 避免与包含相同 Electron 二进制文件的 RPM 包产生 build-id 链接冲突
  fpm:
    - "--rpm-rpmbuild-define"
    - "_build_id_links none"

extraResources:
  - from: "changelogs"
    to: "changelogs"
    filter: ["v${version}/**"]
  - from: "stage"
    to: "stage"
    filter: ["**/*"]
  - from: "guide"
    to: "guide"
    filter: "!**/{.DS_Store,.git,.gitignore,.idea}"
  - from: "appearance/boot"
    to: "appearance/boot"
    filter: "!**/{.DS_Store}"
  - from: "appearance/covers"
    to: "appearance/covers"
    filter: "!**/{.DS_Store}"
  - from: "appearance/icons"
    to: "appearance/icons"
    filter:
      - "index.html"
      - "litheness/**/*"
  - from: "appearance/langs"
    to: "appearance/langs"
    filter: "!**/{.DS_Store}"
  - from: "appearance/emojis"
    to: "appearance/emojis"
    filter: "!**/{.DS_Store}"
  - from: "appearance/themes/midnight"
    to: "appearance/themes/midnight"
    filter: "!**/{.DS_Store,custom.css}"
  - from: "appearance/themes/daylight"
    to: "appearance/themes/daylight"
    filter: "!**/{.DS_Store,custom.css}"
  - from: "appearance/fonts"
    to: "appearance/fonts"
    filter: "!**/{.DS_Store}"
