extends: "./electron-builder-common.yml"
productName: "Kora Note"
appId: "org.b3log.siyuan"
publish: null
asar: false
compression: "normal"
artifactName: "koranote-${version}-${os}-arm64.${ext}"
extraMetadata:
  main: "electron-dist/main.js"
directories:
  output: "build"
  buildResources: "nsis-resources"
files:
  - "electron-dist"
extraFiles:
  - from: "../LICENSE"
    to: "LICENSE"
  - from: "../THIRD_PARTY_NOTICES.md"
    to: "THIRD_PARTY_NOTICES.md"
win:
  icon: "src/assets/icon.ico"
  extraResources:
    - from: "kernel-arm64"
      to: "kernel"
    - from: "src/assets/markdown.ico"
      to: "markdown.ico"
  requestedExecutionLevel: "asInvoker"
  signtoolOptions:
    signingHashAlgorithms: [ 'sha256' ]
    rfc3161TimeStampServer: "http://timestamp.acs.microsoft.com/"
  target:
    - target: "nsis"
      arch: "arm64"
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  deleteAppDataOnUninstall: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "Kora Note"
  license: "../LICENSE"
  include: "nsis/installer.nsh"
  warningsAsErrors: false
  installerSidebar: "nsis/installerSidebar.bmp"
  uninstallerSidebar: "nsis/uninstallerSidebar.bmp"

extraResources:
  - from: "changelogs"
    to: "changelogs"
    filter: ["v${version}/**"]
  - from: "stage"
    to: "stage"
    filter: ["**/*"]
  - from: "guide"
    to: "guide"
    filter: "!**/{.DS_Store,.git,.gitignore,.idea}"
  - from: "appearance/boot"
    to: "appearance/boot"
    filter: "!**/{.DS_Store}"
  - from: "appearance/covers"
    to: "appearance/covers"
    filter: "!**/{.DS_Store}"
  - from: "appearance/icons"
    to: "appearance/icons"
    filter:
      - "index.html"
      - "litheness/**/*"
  - from: "appearance/langs"
    to: "appearance/langs"
    filter: "!**/{.DS_Store}"
  - from: "appearance/emojis"
    to: "appearance/emojis"
    filter: "!**/{.DS_Store}"
  - from: "appearance/themes/midnight"
    to: "appearance/themes/midnight"
    filter: "!**/{.DS_Store,custom.css}"
  - from: "appearance/themes/daylight"
    to: "appearance/themes/daylight"
    filter: "!**/{.DS_Store,custom.css}"
  - from: "appearance/fonts"
    to: "appearance/fonts"
    filter: "!**/{.DS_Store}"
